[metadata]
name = pbj-langgraph
version = 1.0.0
author = BCH Health NLP Lab
author_email = sean.finan@childrens.harvard.edu
description = Tools that can act as a bridge between cTAKES-PBJ and LangGraph.
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Programming Language :: Python :: 3.12
    Operating System :: OS Independent
    License :: OSI Approved :: Apache Software License

[options]
package_dir=
    = src
packages = find:
python_requires = >=3.12
install_requires =
    pbj-llm-tools
    langgraph

[options.packages.find]
where = src
