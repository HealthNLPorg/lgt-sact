[metadata]
name = langgraph-timelines
version = 1.0.0
author = BCH Health NLP Lab
author_email = jiarui.yao@childrens.harvard.edu
description = Tools that can act as a bridge between Langgraph and cTAKES-PBJ.
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Programming Language :: Python :: 3.12
    Operating System :: OS Independent
    License :: OSI Approved :: Apache Software License

[options]
package_dir=
    = src
packages = find:
python_requires = >=3.12
install_requires =
    pbj_langgraph
    protobuf
    torch
    peft
    bitsandbytes>=0.46.1
    pandas>=2.0.0
    transformers>=4.0.0

[options.packages.find]
where = src
